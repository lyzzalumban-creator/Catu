<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A08">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo/penniq-ikon-192.png">
<link rel="apple-touch-icon" href="assets/logo/penniq-ikon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="penniq">
<title>penniq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <header class="top">
    <div class="brand"><span id="mascot"></span><div class="brand-t" id="brand"></div></div>
    <div class="top-r">
      <span id="sync" class="sync s-local" title="Status penyimpanan" data-action="sync-tap"><i></i><em style="font-style:normal">Lokal</em></span>
      <button class="ibtn" id="eyeBtn" data-action="privacy" aria-label="Mode privasi"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="fab-bd" id="fabBd" data-action="fab"></div>
<div class="dock" id="dock"><div class="dock-in">
  <nav class="tbar" aria-label="Navigasi">
    <button class="nv" data-action="nav" data-arg="home" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></button>
    <button class="nv" data-action="nav" data-arg="mut" data-nav="mut" aria-label="Transaksi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-2-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8.5h6M9 12.5h6"/></svg><span>Transaksi</span></button>
    <button class="nv" data-action="nav" data-arg="an" data-nav="an"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Analitik</span></button>
    <button class="nv" data-action="nav" data-arg="manage" data-nav="manage"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2.5"/><rect x="14" y="3" width="7" height="7" rx="3.5"/><rect x="3" y="14" width="7" height="7" rx="3.5"/><rect x="14" y="14" width="7" height="7" rx="2.5"/></svg><span>Kelola</span></button>
    <button class="nv" data-action="nav" data-arg="set" data-nav="set"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Atur</span></button>
  </nav>
  <button class="fab" id="fabBtn" data-action="fab" aria-label="Tambah" aria-haspopup="menu" aria-expanded="false"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="fabm" id="fabm" role="menu" aria-label="Tambah">
    <button class="fm" role="menuitem" data-action="fab-go" data-arg="exp" style="--d:0"><span>Pengeluaran</span><i class="fmi neg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></i></button>
    <button class="fm" role="menuitem" data-action="fab-go" data-arg="inc" style="--d:1"><span>Pemasukan</span><i class="fmi pos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M15 17H7V9"/></svg></i></button>
    <button class="fm" role="menuitem" data-action="fab-go" data-arg="xfer" style="--d:2"><span>Transfer</span><i class="fmi blu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></i></button>
  </div>
</div></div>
<div id="sheet" class="sheet" hidden></div>
<div id="snack" class="snack" role="status"></div>

<script src="app.js"></script>
</body>
</html>
